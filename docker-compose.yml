version: "3.8"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: x-sme-postgres
    environment:
      POSTGRES_DB: x_sme_db
      POSTGRES_USER: ${POSTGRES_USER:-x_sme_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-x_sme_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/backups:/backups
    ports:
      - "5432:5432"
    networks:
      - x-sme-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-x_sme_user}"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis for caching and sessions
  redis:
    image: redis:7-alpine
    container_name: x-sme-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_password}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - x-sme-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Backend API Server
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: x-sme-server
    env_file:
      - env.production
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-x_sme_user}:${POSTGRES_PASSWORD:-x_sme_password}@postgres:5432/x_sme_db?schema=public
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_password}@redis:6379
    volumes:
      - ./server/uploads:/app/uploads
      - ./server/logs:/app/logs
      - ./server/backups:/app/backups
    ports:
      - "3001:3001"
    networks:
      - x-sme-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend Client
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: x-sme-client
    env_file:
      - env.production
    environment:
      - NODE_ENV=production
      - VITE_API_URL=${VITE_API_URL:-https://193.36.84.222}
    ports:
      - "3000:80"
    networks:
      - x-sme-network
    depends_on:
      - server
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: x-sme-nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
      - ./client/dist:/usr/share/nginx/html
    ports:
      - "80:80"
      - "443:443"
    networks:
      - x-sme-network
    depends_on:
      - client
      - server
    restart: unless-stopped

  # Backup Service
  backup:
    image: postgres:15-alpine
    container_name: x-sme-backup
    environment:
      POSTGRES_DB: x_sme_db
      POSTGRES_USER: ${POSTGRES_USER:-x_sme_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-x_sme_password}
    volumes:
      - ./server/backups:/backups
      - ./scripts/backup.sh:/backup.sh
    networks:
      - x-sme-network
    command: sh -c "chmod +x /backup.sh && /backup.sh"
    depends_on:
      - postgres
    restart: "no"

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  x-sme-network:
    driver: bridge
