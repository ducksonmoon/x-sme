<!doctype html>
<html lang="fa" dir="rtl">

      // Keep assets rooted when opening or refreshing a nested route. The
      // same build also works at /repo/ on a GitHub Pages project site.
      if (window.location.hostname.endsWith("github.io")) {
        document.getElementById("app-base").href =
          "/" + window.location.pathname.split("/")[1] + "/";
      }
    </script>

    <title>دایره - وب، نرم‌افزار و هوش مصنوعی</title>
    <style>
      /* This screen works before the application or its stylesheet downloads. */
      #site-boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        padding: 32px;
        background: #f4f1e8;
        color: #123c3d;
        font:
          16px/1.9 Tahoma,
          Arial,
          sans-serif;
        text-align: center;
      }
      #site-boot p {
        max-width: 440px;
        margin: 0;
      }
      #site-boot-actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 24px;
      }
      #site-boot-actions[hidden] {
        display: none;
      }
      #site-boot a {
        color: inherit;
        text-underline-offset: 5px;
      }
      #site-boot button {
        border: 1px solid #123c3d;
        border-radius: 8px;
        background: #123c3d;
        color: #f4f1e8;
        padding: 12px 24px;
        font: inherit;
        cursor: pointer;
      }
      #site-boot :focus-visible {
        outline: 2px solid #123c3d;
        outline-offset: 5px;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="site-boot" role="status" aria-live="polite">
        <svg width="64" height="64" viewBox="0 0 200 200" aria-hidden="true">
          <path
            fill="#123c3d"
            fill-rule="evenodd"
            d="M 130 10 L 109 30 C 155 31 188 64 188 110 C 188 158 151 194 104 194 C 54 194 14 156 14 109 C 14 62 48 24 92 16 C 107 13 119 10 130 10 Z M 79 57 C 58 53 43 69 38 88 C 33 108 44 119 57 112 L 94 82 C 104 70 97 58 79 57 Z M 118 80 C 143 78 168 103 165 129 C 163 154 144 173 119 172 C 97 172 75 162 76 140 C 77 126 91 105 104 88 C 109 83 112 80 118 80 Z"
          />
        </svg>
        <p id="site-boot-message">در حال بارگذاری دایره…</p>
        <div id="site-boot-actions" hidden>
          <button id="site-boot-reload" type="button">بارگذاری دوباره</button>
          <a href="mailto:info@circlegroup.ir" dir="ltr">info@circlegroup.ir</a>
        </div>
        <noscript>
          <p>برای نمایش کامل سایت، جاوااسکریپت مرورگر را فعال کنید.</p>
          <a href="mailto:info@circlegroup.ir" dir="ltr">info@circlegroup.ir</a>
        </noscript>
      </div>
    </div>
    <script>
      // A failed or stalled entry download must not leave an empty page.
      // React removes this screen when it renders; no reload happens automatically.
      (function () {
        function showRecovery() {
          var message = document.getElementById("site-boot-message");
          if (!message) return;
          message.textContent =
            "بارگذاری بیشتر از معمول طول کشیده است. اتصال اینترنت را بررسی کنید یا دوباره تلاش کنید.";
          document.getElementById("site-boot-actions").hidden = false;
        }
        document
          .getElementById("site-boot-reload")
          .addEventListener("click", function () {
            window.location.reload();
          });
        window.setTimeout(showRecovery, 10000);
        window.addEventListener(
          "error",
          function (event) {
            if (
              event.target &&
              event.target.tagName === "SCRIPT" &&
              event.target.type === "module"
            ) {
              showRecovery();
            }
          },
          true,
        );
      })();
    </script>
    <script>
      // Undo the 404.html redirect trick (see public/404.html): a direct
      // load of a client-side route gets bounced here as "/?/portfolio/...".
      // The base element keeps assets rooted while this restores the real
      // URL before React Router reads it.
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(
            null,
            "",
            l.pathname.slice(0, -1) + decoded + l.hash,
          );
        }
      })(window.location);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
