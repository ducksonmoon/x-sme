  <body>
    <div id="root"></div>
    <script>
      // Undo the 404.html redirect trick (see public/404.html): a direct
      // load of a client-side route gets bounced here as "/?/portfolio/..."
      // so the document always loads from the site's actual root, letting
      // the relative asset tags in <head> resolve correctly. This runs
      // after those tags (must stay in <body>, after them) but before the
      // deferred module script below, restoring the real URL for React
      // Router to read. Running it any earlier would rewrite
      // document.baseURI before the <head> tags above get resolved,
      // breaking those requests instead.
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(
            null,
            "",
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      })(window.location);
    </script>
    <script type="module" src="/src/main.tsx"></script>
