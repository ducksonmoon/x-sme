<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <base id="app-base" href="/" />
    <script>
      // Keep assets rooted when opening or refreshing a nested route. The
      // same build also works at /repo/ on a GitHub Pages project site.
      if (window.location.hostname.endsWith("github.io")) {
        document.getElementById("app-base").href =
          "/" + window.location.pathname.split("/")[1] + "/";
      }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Per-page Helmet metadata replaces these initial defaults. -->
    <meta
      name="description"
      data-rh="true"
      content="دایره - طراحی وب‌سایت، نرم‌افزار و راهکارهای هوش مصنوعی برای کسب‌وکارها"
    />
    <meta
      name="keywords"
      content="دایره, طراحی وب‌سایت, نرم‌افزار, هوش مصنوعی, مدیریت انبار, کنترل کیفیت, کسب‌وکار"
    />
    <meta name="author" content="Circle" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" data-rh="true" content="https://circlegroup.ir/" />
    <meta
      property="og:title"
      data-rh="true"
      content="دایره - وب، نرم‌افزار و هوش مصنوعی"
    />
    <meta
      property="og:description"
      data-rh="true"
      content="طراحی وب‌سایت، نرم‌افزار و راهکارهای هوش مصنوعی برای کسب‌وکارها"
    />
    <meta property="og:image" content="https://circlegroup.ir/og-image.jpg" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta
      property="twitter:url"
      data-rh="true"
      content="https://circlegroup.ir/"
    />
    <meta
      property="twitter:title"
      data-rh="true"
      content="دایره - وب، نرم‌افزار و هوش مصنوعی"
    />
    <meta
      property="twitter:description"
      data-rh="true"
      content="طراحی وب‌سایت، نرم‌افزار و راهکارهای هوش مصنوعی برای کسب‌وکارها"
    />
    <meta
      property="twitter:image"
      content="https://circlegroup.ir/og-image.jpg"
    />

    <!-- Theme Color -->
    <meta name="theme-color" content="#123C3D" />
    <meta name="msapplication-TileColor" content="#123C3D" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="دایره" />

    <!-- Manifest -->
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />

    <!-- Vazirmatn is bundled with the brand components. -->

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="./brand/favicon.svg" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="./favicon-16x16.png"
    />
    <link rel="shortcut icon" href="./favicon.ico" />

    <title>دایره - وب، نرم‌افزار و هوش مصنوعی</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Undo the 404.html redirect trick (see public/404.html): a direct
      // load of a client-side route gets bounced here as "/?/portfolio/...".
      // The base element keeps assets rooted while this restores the real
      // URL before React Router reads it.
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(
            null,
            "",
            l.pathname.slice(0, -1) + decoded + l.hash,
          );
        }
      })(window.location);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
